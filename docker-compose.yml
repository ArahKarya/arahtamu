services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arahkarya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arahkarya}
      POSTGRES_DB: ${POSTGRES_DB:-arahkarya}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tidak di-publish ke host (diakses app via jaringan compose `postgres:5432`).
    # Hindari bentrok port host dengan app lain di RPi5. Uncomment untuk debug lokal.
    # ports:
    #   - '127.0.0.1:${DB_PORT:-5444}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-arahkarya}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Internal-only (app akses via `redis:6379`). Uncomment untuk debug lokal.
    # ports:
    #   - '127.0.0.1:${REDIS_PUB_PORT:-6384}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arahkarya}:${POSTGRES_PASSWORD:-arahkarya}@postgres:5432/${POSTGRES_DB:-arahkarya}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      APP_URL: ${APP_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@arahkarya.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_TIMEOUT_MS: ${SEED_TIMEOUT_MS:-180000}
      EMAIL_FROM: ${EMAIL_FROM:-ArahTamu <noreply@arahtamu.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    volumes:
      - app_uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-arahkarya}:${POSTGRES_PASSWORD:-arahkarya}@postgres:5432/${POSTGRES_DB:-arahkarya}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    command: ['node', 'server/dist/worker.js']

volumes:
  postgres_data:
  redis_data:
  app_uploads:
